# OpenDDS config of the prodsim programs: RTPS discovery and transport, no
# DCPSInfoRepo (installed to PREFIX/share/prodsim, passed by the programs as
# -DCPSConfigFile)
[common]
DCPSDefaultDiscovery=DEFAULT_RTPS
DCPSGlobalTransportConfig=$file

[transport/the_rtps_transport]
transport_type=rtps_udp
