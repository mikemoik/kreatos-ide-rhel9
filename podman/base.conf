# Build args of podman/Containerfile, passed with
#   podman build --build-arg-file podman/base.conf …
# Replace this file to build on another RHEL9-compatible base; the image has
# to provide the packages the Containerfile installs, after $CONF_DIR/repos.sh.
#
# BASE: base image of both stages
BASE=docker.io/rockylinux/rockylinux:9
# CONF_DIR: directory (relative to the build context, the repo root) with the
# files copied into the image:
#   repos.sh    -> run as root in both stages before any dnf install (repo setup)
#   ubi.repo    -> /etc/yum.repos.d/ (both stages, before any dnf install)
#   pip.conf    -> /etc/pip.conf (system-wide pip config, e.g. the index URL)
#   uv.toml     -> /etc/uv/uv.toml (system-wide uv config; uv ignores pip.conf)
#   machine.crt -> the client certificate (mTLS; certificate + private key in
#                  one PEM file): KIDE_USER's ~/.pip/machine.crt (mode 600),
#                  used by pip (PIP_CLIENT_CERT) and uv (SSL_CLIENT_CERT); no
#                  client-cert line in pip.conf needed. Empty = none.
#   other *.crt -> CA certificates, every one into the system trust store
#                  (update-ca-trust); PEM (several certs per file are fine) or
#                  DER. The build stops if one holds a private key or no
#                  certificate, or a certificate does not end up in
#                  /etc/pki/tls/certs/ca-bundle.crt, which pip (PIP_CERT) and
#                  uv (SSL_CERT_FILE) use. Empty files and none add nothing.
# podman/conf holds empty placeholders.
CONF_DIR=podman/conf
# KIDE_USER: the user the image runs as (every install step runs as root).
# If the base image already has this user (e.g. "default", uid 1001, in Red
# Hat's application images), it is used as is and KIDE_UID/KIDE_GID must be
# its uid/gid; otherwise it is created with them. `podman run` maps you on the
# host to it: --userns=keep-id:uid=<KIDE_UID>,gid=<KIDE_GID>.
KIDE_USER=default
KIDE_UID=1001
KIDE_GID=1001
