# pip's system-wide config, copied to /etc/pip.conf (podman/Containerfile).
# DUMMY values: replace the URL with the company's pip package repo on prod.
#
# client-cert: the user's client certificate for that repo (mTLS), from
# CONF_DIR/pip-server.crt, installed as KIDE_USER's ~/.pip/pip-server.crt.
# pip expands ~ for each user, so the one line serves every user who has the
# file (root has none and installs nothing with pip).
[global]
index-url = https://pypi.example.com/simple
client-cert = ~/.pip/pip-server.crt
