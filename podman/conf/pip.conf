# pip's system-wide config, copied to /etc/pip.conf (podman/Containerfile).
# The index URL below is a placeholder (PIP_INDEX_URL between @ signs); the
# build replaces it with PIP_INDEX_URL from
# podman/base.conf (the pip package repo; default PyPI).
#
# cert: the system trust store (RHEL's CA bundle). The build adds the pip
# server's certificate (CONF_DIR/pip-server.crt) to it, so pip trusts the repo;
# without this line pip would use its own bundled roots and reject it.
[global]
index-url = @PIP_INDEX_URL@
cert = /etc/pki/tls/certs/ca-bundle.crt
