# uv's system-wide config, copied to /etc/uv/uv.toml (podman/Containerfile).
# uv does not read pip.conf: the company repo is set here too.
# DUMMY values: replace the URL with the company's pip package repo on prod
# (the same as index-url in pip.conf).
# Reference: https://docs.astral.sh/uv/reference/settings/
#
# Order matters (TOML): the plain settings must stay above the first [[index]]
# block, otherwise they belong to that index and uv ignores them.

# Use the RHEL Pythons (python3.12 from dnf) and never download one from the
# internet (no access to GitHub on the target).
python-preference = "only-system"
python-downloads = "never"

# Check the repo's server certificate against the system trust store (where a
# company CA lives), not uv's own bundled roots. uv 0.12: `system-certs`
# (`native-tls` is deprecated).
system-certs = true

# The client certificate (CONF_DIR/pip-server.crt) has no setting in this
# file: uv only reads it from SSL_CLIENT_CERT, which the image sets as ENV to
# /etc/kide/pip-server.crt (a link to KIDE_USER's ~/.pip/pip-server.crt), at
# build time and runtime.

# The company pip package repo, used instead of pypi.org.
[[index]]
name = "company"
url = "https://pypi.example.com/simple"
default = true
