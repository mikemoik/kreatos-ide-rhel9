# uv's system-wide config, copied to /etc/uv/uv.toml (podman/Containerfile).
# uv does not read pip.conf: the pip package repo is set here too.
# The index URL below is a placeholder (PIP_INDEX_URL between @ signs); the
# build replaces it with PIP_INDEX_URL from
# podman/base.conf (the same URL as index-url in pip.conf; default PyPI).
# Reference: https://docs.astral.sh/uv/reference/settings/
#
# Order matters (TOML): the plain settings must stay above the first [[index]]
# block, otherwise they belong to that index and uv ignores them.

# Use the RHEL Pythons (python3.12 from dnf) and never download one from the
# internet (no access to GitHub on the target).
python-preference = "only-system"
python-downloads = "never"

# Check the repo's server certificate against the system trust store, where
# the build adds the pip server's certificate (CONF_DIR/pip-server.crt), not
# uv's own bundled roots. uv 0.12: `system-certs` (`native-tls` is deprecated).
system-certs = true

# Copy packages from uv's cache instead of hardlinking them. In the container
# the cache (~/.cache/uv, in the image's filesystem) and the target (a venv in
# the /workspace mount, the base image's venv, ~/.local) are on different
# filesystems, so hardlinks fail and uv warns "Failed to hardlink files" on
# every install before falling back to a copy anyway.
link-mode = "copy"

# The pip package repo (on prod the company's, instead of pypi.org).
[[index]]
name = "pip-repo"
url = "@PIP_INDEX_URL@"
default = true
